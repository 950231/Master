name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/new-app-development-ixy8q4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Publish the built site to the gh-pages branch. GitHub serves this
      # branch as the Pages site (auto-enabled on first publish for public repos).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
